# First, so it is the default: it answers every host but www.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # One address per page, the one its canonical link gives: no trailing slash,
  # no index.html. The redirects are relative, so they keep the visitor's https.
  absolute_redirect off;
  rewrite ^/index\.html$ / permanent;
  rewrite ^/(.+)/index\.html$ /$1 permanent;
  rewrite ^/(.+)/$ /$1 permanent;

  # Hashed build output.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  error_page 404 /404.html;
}

# www redirects to the apex.
server {
  listen 80;
  server_name www.agnteng.com;
  return 301 https://agnteng.com$request_uri;
}
