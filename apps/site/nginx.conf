# First, so it is the default: it answers every host but www.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # One address per page, the one its canonical link gives: no trailing slash,
  # no index.html. The redirects are relative, so they keep the visitor's https.
  # Only plain paths are redirected: nginx matches the decoded path, and a
  # decoded "\" at its start would send the visitor to another site.
  absolute_redirect off;
  rewrite ^/index\.html$ / permanent;
  rewrite ^/([\w-][\w./-]*)/index\.html$ /$1 permanent;
  rewrite ^/([\w-][\w./-]*)/$ /$1 permanent;

  # Hashed build output: files directly in /assets/ or /assets/images/ (public subfolders aren't hashed).
  location ~ ^/assets/(images/)?[^/]+$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Addresses before docs/adr/0021: the same files, same names.
  location ^~ /images/ { rewrite ^/images/(.*)$ /assets/images/$1 permanent; }
  location ^~ /_astro/ { rewrite ^/_astro/(.*)$ /assets/$1 permanent; }

  # Partner proposals are built here and served only by sponsors.agnteng.com, behind a
  # password (docs/adr/0029).
  location ^~ /partners/ { return 404; }
  location = /partners { return 404; }

  location / {
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404.html;
}

# www redirects to the apex.
server {
  listen 80;
  server_name www.agnteng.com;
  return 301 https://agnteng.com$request_uri;
}
